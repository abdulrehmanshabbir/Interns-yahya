<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daily Progress Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: same system as Interns Resources and Python Problems: centred header, one outlined template card with a header strip. */
:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --muted: #6e6e6e;
  --faint: #b9b9b9;
  --line: #e3e3e3;
  --soft: #f5f5f5;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --ink: #f2f2f2; --muted: #8c8c8c; --faint: #4a4a4a; --line: #262626; --soft: #141414;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --ink: #f2f2f2; --muted: #8c8c8c; --faint: #4a4a4a; --line: #262626; --soft: #141414;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.masthead { padding-block: 64px 32px; display: grid; gap: 10px; justify-items: center; text-align: center; }
h1 { font-weight: 600; font-size: clamp(30px, 5.5vw, 42px); line-height: 1.1; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 52ch; text-wrap: balance; }
.lede b { color: var(--ink); font-weight: 500; font-family: var(--font-mono); font-size: .92em; white-space: nowrap; }

/* Template card */
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-bottom: 64px; min-width: 0; }
.card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--line);
}
.card-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.copy {
  font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
  border-radius: 4px; padding: 6px 14px; min-width: 9.5em; justify-content: center;
}
.copy:hover { opacity: .88; }
.copy:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.copy svg { width: 16px; height: 16px; flex: none; }

.sec { padding: 18px 20px; display: grid; gap: 8px; min-width: 0; }
.sec + .sec { border-top: 1px dashed var(--line); }
.sec h2 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35; }
.sec .help { margin: 0; color: var(--muted); font-size: 14.5px; }
.optional { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-left: 8px; font-weight: 400; }

/* Fill-in fields and blank bullets */
.fields { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }
.fields li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.fields b { font-weight: 500; flex: none; }
.placeholder { font-family: var(--font-mono); font-size: 13.5px; color: var(--muted); }
.blank { flex: 1 1 140px; border-bottom: 1px dashed var(--faint); min-height: 1.2em; }
.bullets { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 12px; }
.bullets li::marker { color: var(--muted); }
.bullets li span { display: block; border-bottom: 1px dashed var(--faint); height: 1.3em; }

.note-how {
  margin: 0 0 20px; padding: 12px 16px; border-left: 3px solid var(--ink); background: var(--soft);
  border-radius: 4px; color: var(--muted); font-size: 15px;
}
.note-how b { color: var(--ink); font-weight: 600; }
.note-how .chan { font-family: var(--font-mono); font-size: .92em; color: var(--ink); white-space: nowrap; }

.preview { padding: 22px 20px 24px; display: grid; gap: 18px; min-width: 0; }
.preview p { margin: 0; }
.pv-title { font-size: 17px; }
.preview .placeholder { font-family: var(--font-body); font-size: inherit; }
.pv-title b { font-weight: 600; }
.today { font-variant-numeric: tabular-nums; }
.pv-sec { display: grid; gap: 6px; }
.pv-sec ul { margin: 0; padding-left: 22px; }
.pv-sec li::marker { color: var(--ink); }
.pv-sec li span { display: block; border-bottom: 1px dashed var(--faint); height: 1.3em; max-width: 520px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 520px) {
  .masthead { padding-block: 44px 24px; }
  .card-head, .sec { padding-left: 14px; padding-right: 14px; }
  .copy { width: 100%; }
}
</style>

<header class="wrap masthead">
  <h1>Daily Progress Report</h1>
</header>

<main class="wrap">

  <article class="card">
    <div class="card-head">
      <p class="card-title">Template</p>
      <button class="copy" id="copyBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
        <span id="copyLabel">Copy template</span>
      </button>
      <span class="sr-only" role="status" id="copyStatus"></span>
    </div>

    <div class="preview" id="preview">
      <p class="pv-title"><b>Daily Progress Report <span class="today">--</span></b></p>
      <p>Working hours today: <span class="placeholder">&lt;e.g. 9:00 AM – 5:00 PM&gt;</span></p>
      <div class="pv-sec"><p>What I worked on today</p><ul><li><span></span></li></ul></div>
      <div class="pv-sec"><p>Blockers &amp; challenges</p><ul><li><span></span></li></ul></div>
      <div class="pv-sec"><p>Plan for tomorrow</p><ul><li><span></span></li></ul></div>
      <div class="pv-sec"><p>Notes / queries</p><ul><li><span></span></li></ul></div>
    </div>
  </article>
</main>

<script>
/* Today's date in Pakistan time, formatted like 12-Oct-2026. */
function pakistanDate() {
  const parts = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Karachi", day: "2-digit", month: "short", year: "numeric" })
    .formatToParts(new Date())
    .forEach(p => { parts[p.type] = p.value; });
  return `${parts.day}-${parts.month}-${parts.year}`;
}

const SECTIONS = ["What I worked on today", "Blockers & challenges", "Plan for tomorrow", "Notes / queries"];
const HOURS = "Working hours today: <e.g. 9:00 AM – 5:00 PM>";

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* Plain text: used by apps that do not accept formatting. */
function plainTemplate(date) {
  const lines = [`Daily Progress Report ${date}`, "", HOURS];
  SECTIONS.forEach(title => lines.push("", title, "• "));
  return lines.join("\n");
}

/* Rich text: a bold title and real bulleted lists, so Slack keeps the
   bullets and Enter starts a new point. Nothing else is bold or italic. */
function richTemplate(date) {
  let html = `<p><b>Daily Progress Report ${date}</b></p><p><br></p><p>${esc(HOURS)}</p>`;
  SECTIONS.forEach(title => {
    html += `<p><br></p><p>${esc(title)}</p><ul><li>&nbsp;</li></ul>`;
  });
  return html;
}

function showDate() {
  document.querySelectorAll(".today").forEach(el => { el.textContent = pakistanDate(); });
}
showDate();
setInterval(showDate, 60 * 1000);   // stays correct if the page is left open past midnight

const btn = document.getElementById("copyBtn");
const label = document.getElementById("copyLabel");
const status = document.getElementById("copyStatus");
let resetTimer = null;

function flash(text) {
  label.textContent = text;
  status.textContent = text;
  clearTimeout(resetTimer);
  resetTimer = setTimeout(() => { label.textContent = "Copy template"; status.textContent = ""; }, 1800);
}

/* Fallback: select a hidden rich-text copy and use the browser's copy command. */
function selectionCopy(html) {
  const box = document.createElement("div");
  box.contentEditable = "true";
  box.innerHTML = html;
  box.style.cssText = "position:fixed;left:-9999px;top:0;white-space:pre-wrap;color:#000;background:#fff;font-weight:400;font-style:normal";
  document.body.appendChild(box);
  const range = document.createRange();
  range.selectNodeContents(box);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  sel.removeAllRanges();
  box.remove();
  return ok;
}

btn.addEventListener("click", () => {
  const date = pakistanDate();
  showDate();
  const html = richTemplate(date);
  const text = plainTemplate(date);
  const fail = () => {
    if (selectionCopy(html)) { flash("Copied"); return; }
    try {
      navigator.clipboard.writeText(text).then(() => flash("Copied"), () => flash("Couldn't copy, try again"));
    } catch (e) { flash("Couldn't copy, try again"); }
  };
  try {
    const item = new ClipboardItem({
      "text/html": new Blob([html], { type: "text/html" }),
      "text/plain": new Blob([text], { type: "text/plain" }),
    });
    navigator.clipboard.write([item]).then(() => flash("Copied"), fail);
  } catch (e) {
    fail();
  }
});
</script>

</body></html>
