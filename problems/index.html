<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Python Problem Sets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: same system as Interns Resources and Python Problems: centred header, one outlined card per month listing dated problem sets. */
:root {
  --bg: #ffffff;
  --ink: #0a0a0a;
  --muted: #6e6e6e;
  --line: #e3e3e3;
  --soft: #f5f5f5;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --ink: #f2f2f2; --muted: #8c8c8c; --line: #262626; --soft: #141414;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --ink: #f2f2f2; --muted: #8c8c8c; --line: #262626; --soft: #141414;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.wrap {
  max-width: 780px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.masthead { padding-block: 64px 32px; display: grid; gap: 10px; justify-items: center; text-align: center; }
h1 { font-weight: 600; font-size: clamp(30px, 5.5vw, 42px); line-height: 1.1; letter-spacing: -.02em; margin: 0; }

.months { display: grid; gap: 20px; padding-bottom: 64px; }
.month { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.month-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.month-head h2 { margin: 0; font-size: 17px; font-weight: 600; }
.month-count { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.sets { list-style: none; margin: 0; padding: 0; }
.set { display: flex; align-items: center; gap: 18px; padding: 16px 20px; }
.set + .set { border-top: 1px dashed var(--line); }
.set:hover { background: var(--soft); }

/* Calendar-style date chip */
.cal {
  flex: none; width: 52px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; text-align: center;
  background: var(--bg); font-variant-numeric: tabular-nums;
}
.cal .mon { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--bg); padding: 1px 0; }
.cal .day { display: block; font-size: 20px; font-weight: 600; line-height: 1.5; }

.info { flex: 1 1 auto; min-width: 0; display: grid; gap: 1px; }
.info h3 { margin: 0; font-size: 16.5px; font-weight: 600; line-height: 1.35; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.info p { margin: 0; color: var(--muted); font-size: 14px; }
.badge { font-family: var(--font-mono); font-size: 10.5px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--ink); border-radius: 999px; padding: 0 8px; line-height: 1.6; }

.btn {
  flex: none; font: inherit; font-size: 13.5px; font-weight: 500; border-radius: 4px; padding: 6px 14px;
  border: 1px solid var(--ink); background: var(--bg); color: var(--ink); text-decoration: none;
}
.btn:hover { background: var(--ink); color: var(--bg); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

@media (max-width: 520px) {
  .masthead { padding-block: 44px 24px; }
  .month-head, .set { padding-left: 14px; padding-right: 14px; }
  .set { gap: 12px; }
  .cal { width: 46px; }
}
</style>

<header class="wrap masthead">
  <h1>Python Problem Sets</h1>
</header>

<main class="wrap">
  <div class="months" id="months"></div>
</main>

<script>
/* One entry per problem set. Newest first is worked out automatically. */
const SETS = [
  { date: "2026-10-20", url: "20-10-2026", levels: "Basic \u00b7 Intermediate \u00b7 Advanced" },
];

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function parts(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const weekday = DAYS[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  return { y, m, d, weekday, month: MONTHS[m - 1] };
}

function render() {
  const sorted = [...SETS].sort((a, b) => b.date.localeCompare(a.date));
  const groups = new Map();
  sorted.forEach(s => {
    const p = parts(s.date);
    const key = `${p.month} ${p.y}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ ...s, p });
  });

  const root = document.getElementById("months");
  root.innerHTML = "";
  let first = true;
  groups.forEach((items, label) => {
    const sec = document.createElement("section");
    sec.className = "month";
    const head = document.createElement("div");
    head.className = "month-head";
    const h2 = document.createElement("h2");
    h2.textContent = label;
    head.append(h2);
    const ul = document.createElement("ul");
    ul.className = "sets";
    items.forEach(s => {
      const li = document.createElement("li");
      li.className = "set";
      li.innerHTML = `
        <div class="cal" aria-hidden="true"><span class="mon"></span><span class="day"></span></div>
        <div class="info"><h3></h3></div>
        <a class="btn">Open</a>`;
      li.querySelector(".mon").textContent = s.p.month.slice(0, 3);
      li.querySelector(".day").textContent = s.p.d;
      const h3 = li.querySelector("h3");
      h3.textContent = `${s.p.weekday}, ${s.p.d} ${s.p.month} ${s.p.y}`;
      if (first) {
        const b = document.createElement("span");
        b.className = "badge";
        b.textContent = "Latest";
        h3.appendChild(b);
        first = false;
      }
      const a = li.querySelector("a");
      a.href = s.url;
      a.setAttribute("aria-label", `Open problem set for ${h3.firstChild.textContent}`);
      ul.appendChild(li);
    });
    sec.append(head, ul);
    root.appendChild(sec);
  });
}
render();
</script>

</body></html>
