<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body class="page-problems">
<title>Python Problems</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../style.css">

<header class="wrap masthead">
  <h1>Python Problems</h1>
  <div class="date-row">
    <time class="date" datetime="2026-10-20">Tuesday, 20 October 2026</time>
    <button class="linkbtn" id="resetBtn" type="button">Clear progress</button>
  </div>
  <section class="progress" aria-label="Your progress">
    <div class="progress-top">
      <span class="progress-title">Progress</span>
      <span class="progress-count"><span id="laterCount" class="later-count" hidden></span><strong id="doneCount">0</strong> / 35 solved · <span id="donePct">0%</span></span>
    </div>
    <div class="progress-bar" aria-hidden="true"><i id="barDone"></i><i id="barLater"></i></div>
    <div class="progress-body">
      <div class="dots" id="ladder"></div>
      <div class="dot-labels" id="dotLabels"></div>
    </div>
  </section>
</header>

<nav class="tabbar" aria-label="Stages">
  <div class="wrap tabs" role="tablist" id="tabs"></div>
</nav>

<main class="wrap">
  <div class="stage-intro" aria-hidden="true"></div>
  <div class="list" id="list"></div>
  <nav class="pager" id="pager" aria-label="Problem navigation"></nav>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="app.js"></script>

</body></html>
