<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page not found · #interns-yahya</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1a1d21;
      --muted: #5b6470;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --border: #e3e6ea;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #171a21;
        --text: #e8eaed;
        --muted: #9aa3af;
        --accent: #818cf8;
        --accent-soft: #1e2130;
        --border: #262a33;
        --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 20px 64px;
      text-align: center;
    }
    .eyebrow {
      display: inline-block;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .code {
      font-size: clamp(3.4rem, 14vw, 5.5rem);
      font-weight: 750;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--accent);
      margin: 0 0 4px;
    }
    h1 {
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      line-height: 1.2;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    .intro { color: var(--muted); font-size: 1.05rem; margin: 0 0 32px; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a.btn {
      display: inline-block;
      text-decoration: none;
      font-weight: 600;
      font-size: .98rem;
      padding: 12px 22px;
      border-radius: 12px;
      border: 1px solid var(--border);
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    a.btn-primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }
    @media (prefers-color-scheme: dark) {
      a.btn-primary { color: #0f1115; }
    }
    a.btn-secondary {
      color: inherit;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    a.btn:hover { transform: translateY(-2px); border-color: var(--accent); }
    footer {
      margin-top: 44px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .88rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="eyebrow">#interns-yahya</span>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p class="intro">The page you're looking for doesn't exist. It may have been moved, renamed, or never existed at all.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/Interns-yahya/">Back to the hub</a>
      <a class="btn btn-secondary" href="./">Home</a>
    </div>

    <footer>
      Maintained for the <strong>#interns-yahya</strong> channel.
    </footer>
  </div>
</body>
</html>
